name: Análise de Fluência — automática e manual

on:
  workflow_dispatch:
    inputs:
      max_jobs:
        description: "Quantidade de leituras a processar"
        required: false
        default: "1"
      model:
        description: "Modelo Faster-Whisper"
        required: true
        default: "medium"
        type: choice
        options:
          - medium
          - small

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: fluencia-analysis
  cancel-in-progress: true

jobs:
  transcrever:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BRIDGE_URL: ${{ secrets.CVS_BRIDGE_URL }}
      BRIDGE_TOKEN: ${{ secrets.CVS_BRIDGE_TOKEN }}
      FW_MODEL: ${{ inputs.model || 'medium' }}
      MAX_JOBS: ${{ inputs.max_jobs || '4' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: fluencia-faster-whisper-${{ env.FW_MODEL }}-v1

      - name: Ensure ffmpeg
        shell: bash
        timeout-minutes: 5
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            timeout 180s sudo apt-get update -qq
            timeout 180s sudo apt-get install -y ffmpeg
            ffmpeg -version | head -n 1
          fi

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      - name: Validate protected configuration
        shell: bash
        run: |
          test -n "$BRIDGE_URL" || (echo "Missing CVS_BRIDGE_URL secret" && exit 1)
          test -n "$BRIDGE_TOKEN" || (echo "Missing CVS_BRIDGE_TOKEN secret" && exit 1)

      - name: Process readings
        run: python analysis/analyze.py
