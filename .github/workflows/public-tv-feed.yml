name: Atualiza ranking público TV

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: public-tv-feed
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buscar ranking sanitizado
        env:
          BRIDGE_URL: ${{ secrets.CVS_BRIDGE_URL }}
          BRIDGE_TOKEN: ${{ secrets.CVS_BRIDGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BRIDGE_URL"
          test -n "$BRIDGE_TOKEN"

          payload=$(jq -nc --arg token "$BRIDGE_TOKEN" '{action:"public_ranking",token:$token}')
          success=0

          for attempt in 1 2 3 4; do
            echo "Bridge attempt $attempt/4..."

            if curl --fail-with-body --silent --show-error --location \
              --connect-timeout 15 --max-time 45 \
              -H 'Content-Type: application/json' \
              -d "$payload" \
              "$BRIDGE_URL" > /tmp/tv-bridge-response.txt; then

              if jq -e '
                type == "object"
                and .ok == true
                and .somente_leitura == true
                and (.categorias | type == "array")
              ' /tmp/tv-bridge-response.txt >/dev/null 2>&1; then
                mkdir -p tv
                jq '.' /tmp/tv-bridge-response.txt > tv/data.json
                jq -c '{ok,somente_leitura,categorias_tipo:(.categorias|type)}' tv/data.json
                success=1
                break
              fi

              echo "Bridge returned an invalid or unexpected response; retrying."
            else
              echo "Bridge request failed; retrying."
            fi

            if [ "$attempt" -lt 4 ]; then
              sleep $((2 ** attempt))
            fi
          done

          if [ "$success" -ne 1 ]; then
            echo "Bridge unavailable after 4 validated attempts."
            exit 1
          fi

      - name: Publicar apenas se mudou
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tv/data.json; then
            echo "Ranking sem mudança."
            exit 0
          fi
          git config user.name "CVS Ranking Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tv/data.json
          git commit -m "data: atualiza ranking público TV"
          git push
