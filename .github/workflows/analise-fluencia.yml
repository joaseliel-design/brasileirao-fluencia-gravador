name: Análise de Fluência — teste manual

on:
  workflow_dispatch:
    inputs:
      max_jobs:
        description: "Quantidade de leituras a processar neste teste"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  transcrever:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BRIDGE_URL: ${{ secrets.CVS_BRIDGE_URL }}
      BRIDGE_TOKEN: ${{ secrets.CVS_BRIDGE_TOKEN }}
      FW_MODEL: small
      MAX_JOBS: ${{ inputs.max_jobs }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: fluencia-faster-whisper-small-v1

      - name: Install dependencies
        run: pip install -r analysis/requirements.txt

      - name: Validate protected configuration
        shell: bash
        run: |
          test -n "$BRIDGE_URL" || (echo "Missing CVS_BRIDGE_URL secret" && exit 1)
          test -n "$BRIDGE_TOKEN" || (echo "Missing CVS_BRIDGE_TOKEN secret" && exit 1)

      - name: Process readings
        run: python analysis/analyze.py
